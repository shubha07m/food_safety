[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "food-safety"
version = "0.3.0"
description = "Independent public-source food safety evidence browser"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "httpx==0.28.1", "beautifulsoup4==4.15.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "pip-audit==2.10.1"]

[project.scripts]
food-safety = "food_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".conda", ".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
