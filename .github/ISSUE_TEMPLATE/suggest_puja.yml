name: Suggest a Puja
description: Share an organizer or event source for Puja FoodPath review.
title: "[Puja suggestion] "
body:
  - type: markdown
    attributes:
      value: "This suggestion is a public GitHub issue. Only its source URL enters the private research queue. Nothing appears in Puja FoodPath without owner approval. Do not include personal contact details."
  - type: input
    id: name
    attributes:
      label: Puja or organizer name
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Kolkata region
        - California
        - London region
        - Toronto / GTA
        - Melbourne
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City or locality
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official or event URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Venue, dates or context (optional)
      description: "A lead only; the source must support any published facts."
