name: Refresh Food Safety Data
on:
  workflow_dispatch:
    inputs:
      release_only:
        description: 'Build and publish static output without source or Gemini research'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: source-update
  cancel-in-progress: false
jobs:
  candidates:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTO_PUBLISH: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: food
          python-version: '3.12'
          auto-activate: false
      - name: Install lightweight dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Limited source scan and validated LLM extraction
        if: github.event_name != 'push' && inputs.release_only != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          result=0
          python -m food_safety.cli update --max-articles 20 || result=$?
          # Partial source failure (2) retains validated suspensions; fatal (1) stops.
          test "$result" -eq 0 -o "$result" -eq 2
      - name: Due-only Puja source checks (daily Sep–Oct, weekly otherwise)
        if: github.event_name != 'push' && inputs.release_only != true
        run: python -m food_safety.cli puja refresh
      - name: Apply owner-approved Puja catalog updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m food_safety.cli puja publish-approved
      - name: Check candidate output
        env:
          LLM_ENABLED: 'false'
        run: |
          mkdir -p .cache
          ruff check .
          python -m pytest -q --basetemp=.cache/pytest
          python -m food_safety.cli validate
          python -m food_safety.cli build
          node --test tests/*.test.mjs
          python scripts/verify_public_output.py
          python scripts/stage_generated.py
      - name: Commit approved artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/stage_generated.py --stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: validated refresh [automated-refresh]'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger another Actions run.
      - name: Close published Puja approval requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m food_safety.cli puja close-approved
      - name: Validate isolated deployment artifact
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          node scripts/build_deployment.mjs
          python scripts/verify_public_output.py --runtime --site dist/site
          python scripts/stage_generated.py
