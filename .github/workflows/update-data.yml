name: Review source update
on:
  workflow_dispatch:
  # Enable only after source/policy review. Six-hour intended cadence:
  # schedule:
  #   - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: source-update
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTO_PUBLISH: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: food
          python-version: '3.12'
          auto-activate: false
      - name: Install lightweight dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Limited source scan, no paid APIs
        run: python -m food_safety.cli update --max-articles 3
      - name: Check candidate output
        run: |
          mkdir -p .cache
          ruff check .
          python -m pytest -q --basetemp=.cache/pytest
          python -m food_safety.cli validate
          python -m food_safety.cli build
      - name: Retain private review artifacts; never deploy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-review-${{ github.run_id }}
          path: |
            data/*.json
            data/*.csv
            data/history/
            data/runs/
          retention-days: 7
          if-no-files-found: error
