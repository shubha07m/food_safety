# Discovery is operator-invoked only. Never read by visitor code or news ingestion.
settings:
  monthly_limit: 3000
  warning_threshold: 2500
  max_calls_per_run: 60
  max_results: 20
  max_retries: 1
  timeout_seconds: 15
  cache_days: 7
  max_zone_radius_m: 1500
  overlap_fraction: 0.7
  default_restaurant_radius_m: 600
  max_supplemental_searches: 3
  supplemental_offset_m: 300
  supplemental_radius_m: 400
  automatic_zones: true
pandals:
  - pandal_id: bagbazar-sarbojanin
    name: Bagbazar Sarbojanin Durgotsav
    name_bn: বাগবাজার সর্বজনীন দুর্গোৎসব
    area: Bagbazar
    latitude: 22.6046989
    longitude: 88.3661347
    restaurant_radius_m: 600
    enabled: true
    coordinate_source: https://www.openstreetmap.org/node/10081941244
    notes: >-
      Independently sourced OpenStreetMap venue anchor. Not a verified 2026
      entrance or pedestrian route; verify current festival access before travel guidance.
  - pandal_id: kumartuli-park
    name: Kumartuli Park Sarbojanin
    name_bn: কুমোরটুলি পার্ক সর্বজনীন
    area: Kumartuli
    enabled: false
    notes: Starter entry only; coordinates and current venue need independent curation.
  - pandal_id: ekdalia-evergreen
    name: Ekdalia Evergreen
    name_bn: একডালিয়া এভারগ্রিন
    area: Ballygunge
    enabled: false
    notes: Starter entry only; coordinates and current venue need independent curation.
